# Mosquitto config for the SmartGrid Meter scenario.
# This is INTENTIONALLY INSECURE for cyber-range training.

listener 1883 0.0.0.0

# Anonymous access enabled - any client can connect, subscribe to any
# topic, and publish to any topic.
allow_anonymous true

# No TLS. Telemetry travels in clear text.
persistence false
log_dest stdout
log_type all
