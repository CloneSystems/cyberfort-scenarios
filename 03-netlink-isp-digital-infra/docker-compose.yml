services:
  api:
    build: ./api
    container_name: netlink_api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - netlink

  db:
    image: postgres:13
    container_name: netlink_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: netlink
      POSTGRES_USER: netlink_app
      POSTGRES_PASSWORD: "NetLink-DB-2024"
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - netlink_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netlink_app -d netlink"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - netlink

networks:
  netlink:
    driver: bridge

volumes:
  netlink_data:
