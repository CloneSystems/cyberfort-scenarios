{% extends "base.html" %}
{% block title %}Login &middot; PortPilot{% endblock %}
{% block content %}
<div class="login-card">
  <h1>Sign in</h1>
  <p class="hint">Use your operator credentials issued by the port authority.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    <label>Username
      <input type="text" name="username" autofocus required>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
